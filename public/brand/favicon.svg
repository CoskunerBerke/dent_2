<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <g transform="translate(10, 5)">
    <!-- Tower Dome / Tooth Top -->
    <path d="M 20,5 C 27,5 30,12 30,18 C 30,28 25,32 23,45 L 17,45 C 15,32 10,28 10,18 C 10,12 13,5 20,5 Z" fill="url(#goldGradient)" />
    <!-- Tooth Roots / Tower Legs -->
    <path d="M 13,42 L 11,48 C 11,50 13,52 15,52 C 16.5,52 17,49 17.5,47 L 20,42 L 22.5,47 C 23,49 23.5,52 25,52 C 27,52 29,50 29,48 L 27,42" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Tower Observation Deck Ring -->
    <ellipse cx="20" cy="18" rx="14" ry="4" fill="#07111F" stroke="url(#goldGradient)" stroke-width="2" />
    <ellipse cx="20" cy="18" rx="8" ry="2" fill="url(#goldGradient)" />
    <!-- Tower Spire -->
    <line x1="20" y1="14" x2="20" y2="0" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
  </g>
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B56D" />
      <stop offset="100%" stop-color="#C99A45" />
    </linearGradient>
  </defs>
</svg>
